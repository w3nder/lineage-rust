[package]
name = "killer-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
platform-check = []

[dependencies]
killer-assets = { path = "../../crates/killer-assets" }
killer-render = { path = "../../crates/killer-render" }
killer-ui = { path = "../../crates/killer-ui" }
killer-world = { path = "../../crates/killer-world" }
killer-platform = { path = "../../crates/killer-platform" }
wgpu.workspace = true
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
log.workspace = true
serde_json = "1"
lz4_flex = "0.14"
l2-net = { path = "../../crates/l2-net" }
l2-dat = { path = "../../crates/l2-dat" }
ue2-assets = { path = "../../crates/ue2-assets" }
ue2-level = { path = "../../crates/ue2-level" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "Blob", "Window", "Document", "Element", "HtmlInputElement", "FileList", "File", "Event"] }
js-sys = "0.3"

[dev-dependencies]
flate2.workspace = true

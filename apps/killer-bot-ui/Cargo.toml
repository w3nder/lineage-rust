[package]
name = "killer-bot-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
killer-bot-core = { path = "../../crates/killer-bot-core" }
killer-world = { path = "../../crates/killer-world" }
killer-bot-script = { path = "../../crates/killer-bot-script" }
l2-net = { path = "../../crates/l2-net" }
killer-ui = { path = "../../crates/killer-ui" }
killer-assets = { path = "../../crates/killer-assets" }
killer-download = { path = "../../crates/killer-download" }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
png.workspace = true

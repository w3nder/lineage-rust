[package]
name = "killer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "killer"
path = "src/android.rs"
crate-type = ["cdylib"]

[[bin]]
name = "killer"
path = "src/main.rs"

[dependencies]
killer-platform = { path = "../../crates/killer-platform" }
killer-assets = { path = "../../crates/killer-assets" }
killer-render = { path = "../../crates/killer-render" }
killer-ui = { path = "../../crates/killer-ui" }
killer-font = { path = "../../crates/killer-font" }
killer-world = { path = "../../crates/killer-world" }
l2-crypto = { path = "../../crates/l2-crypto" }
l2-dat = { path = "../../crates/l2-dat" }
l2-net = { path = "../../crates/l2-net" }
ue2-assets = { path = "../../crates/ue2-assets" }
ue2-level = { path = "../../crates/ue2-level" }
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
glam.workspace = true
pollster.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
sha2 = "=0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "vorbis", "wav"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
alto = "=3.0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.14"

[package.metadata.android]
package = "dev.killer.client"
build_targets = ["aarch64-linux-android"]
apk_name = "Killer"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Killer"

[package.metadata.android.application.activity]
orientation = "landscape"
config_changes = "orientation|keyboardHidden|screenSize"

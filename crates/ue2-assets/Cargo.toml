[package]
name = "ue2-assets"
description = "Unreal Engine 2 objects read in place from packages: properties, textures and static meshes."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Canastra-Source-1.0"

[dependencies]
ue2-core = { path = "../ue2-core" }
